<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're connected · Ivin Networks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,600..800;1,9..144,600..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--surf:#121418;--ink:#ece8e1;--mut:#9ba1a8;--line:#24282e;--acc:#f5a623;--ok:#4cc38a;color-scheme:dark;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f3;--surf:#fff;--ink:#14171a;--mut:#58606a;--line:#dcdfdc;--acc:#b36a00;--ok:#1f8a5b;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f5f3;--surf:#fff;--ink:#14171a;--mut:#58606a;--line:#dcdfdc;--acc:#b36a00;--ok:#1f8a5b;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(60rem 30rem at 85% -10%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 70%),var(--bg);color:var(--ink);font:400 1.0625rem/1.7 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.w{width:100%;max-width:60rem;margin:0 auto;padding:0 clamp(1.25rem,4vw,2.75rem)}
.top{padding-top:calc(1.5rem + env(safe-area-inset-top,0px));text-align:center}
.brand{text-decoration:none;font-weight:600;letter-spacing:.04em;font-size:.95rem}
.brand em{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:700;color:var(--acc);letter-spacing:0;font-size:1.05rem}
main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2.5rem 0}
main>div{width:100%;max-width:30rem}
.tick{display:block;width:5rem;height:5rem;margin:0 auto 1.75rem}
.tick circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:176;stroke-dashoffset:176;animation:draw .8s ease-out .1s forwards}
.tick path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s ease-out .8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tick.off circle,.tick.off path{stroke:var(--acc)}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2.6rem,12vw,4.75rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 1.25rem;text-wrap:balance}
h1 em{color:var(--acc);font-weight:700}
.lede{color:var(--mut);max-width:26rem;margin:0 auto 1.75rem}
.hint{color:var(--mut);font-size:.93rem;margin:0 0 2rem}
.again .tick circle,.again .tick path{animation:none;stroke-dashoffset:0}
.status{display:inline-flex;align-items:center;gap:.6rem;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:.4rem 1rem;font-size:.93rem;margin-bottom:2rem}
.status i{width:.55rem;height:.55rem;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.status.off i{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.cta{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;background:var(--acc);color:#1a1100;font-weight:600;text-decoration:none;padding:.8rem 1.4rem;border-radius:999px;font-size:.98rem}
.btn:hover{filter:brightness(1.1)}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.o:hover{border-color:var(--mut);filter:none}
footer{padding:1.5rem 0 2.5rem;color:var(--mut);font-size:.9rem}
footer .w{display:flex;justify-content:center;gap:.4rem 1.5rem;flex-wrap:wrap;text-align:center}
@media (max-width:520px){.cta{flex-direction:column}.btn{text-align:center;padding:1rem 1.4rem;font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){.tick circle,.tick path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="w top"><a class="brand" href="index.html">IVIN <em>Networks</em></a></div>
<div class="w">
<main>
  <div>
    <svg class="tick" id="tick" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><path d="M20 33l8 8 16-17"/></svg>
    <h1 id="head">You're <em>connected.</em></h1>
    <p class="lede" id="msg">You're on the Wi-Fi. This network was installed and is managed by Ivin Networks.</p>
    <p class="hint" id="hint" role="status">Finishing connection…</p>
    <div class="cta"><a class="btn o" href="contact.html">Having trouble?</a></div>
  </div>
</main>
</div>
<footer><div class="w"><span>© 2026 Ivin Networks</span><a href="index.html">ivinnetworks.charlieivin.co.uk</a></div></footer>
<script>
(function(){
  var p=new URLSearchParams(location.search),n=parseInt(p.get("r"),10)||0,MAX=5,hint=document.getElementById("hint");
  if(n>0)document.documentElement.classList.add("again");
  if(n<MAX){
    setTimeout(function(){p.set("r",n+1);location.replace(location.pathname+"?"+p.toString());},2000);
  }else{
    hint.textContent="All set. You can close this window.";
  }
})();
</script>
</body>
</html>
